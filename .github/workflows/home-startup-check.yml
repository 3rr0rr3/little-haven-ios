name: Verify saved home startup v57
on:
  push:
    branches: ['codex/home-startup-check']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify unchanged runtime and retain completed native checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences repos/3rr0rr3/little-haven-ios/actions/jobs/122312485128/logs > original-home-job.log
          python3 scripts/verify_home_startup_checks.py
      - name: Build and package arm64 iPhone app
        run: |
          set -euo pipefail
          python3 scripts/render_app_icon.py
          xcodebuild -project LittleHaven.xcodeproj -scheme LittleHaven -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath device-build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP=device-build/Build/Products/Release-iphoneos/LittleHaven.app
          test -x "$APP/LittleHaven"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$APP/Info.plist")" = "iPhoneOS"
          xcrun lipo "$APP/LittleHaven" -verify_arch arm64
          xcrun vtool -show-build "$APP/LittleHaven" | tee platform.txt
          grep -Eq 'platform[[:space:]]+IOS$' platform.txt
          mkdir -p package/Payload
          ditto "$APP" package/Payload/LittleHaven.app
          cd package
          zip -qry ../LittleHaven-unsigned.ipa Payload
          cd ..
          unzip -t LittleHaven-unsigned.ipa
          shasum -a 256 LittleHaven-unsigned.ipa > LittleHaven-unsigned.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LittleHaven-iPhone-IPA
          path: |
            LittleHaven-unsigned.ipa
            LittleHaven-unsigned.ipa.sha256
      - name: Run 48 remaining Debug regressions
        timeout-minutes: 28
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if "iPhone" in v["name"]))')
          echo "SIM_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          export SIM_DEVICE="$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          bash run-home-broad.sh
      - name: Verify four optimized Release startup paths
        timeout-minutes: 24
        run: |
          set -euo pipefail
          bash run-home-release.sh 2>&1 | tee home-release-ui.log
      - name: Verify all UI coverage and saved-home reports
        env:
          STARTUP_CHECKS_FINISHED: 'true'
        run: python3 scripts/verify_home_startup_checks.py
      - name: Retrieve native previews from identical runtime
        uses: actions/download-artifact@v4
        with:
          name: Response-previews
          run-id: 40539158093
          github-token: ${{ github.token }}
      - name: Publish verified v57 download
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_candidate.py
      - name: Preserve verification and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Home-startup-verification
          path: |
            candidate-verification.json
            home-startup-verification.json
            original-home-job.log
            home-broad-ui.log
            home-release-ui.log
            ReleaseStartup-*-report.json
            *.xcresult
