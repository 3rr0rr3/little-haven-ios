name: Deliver verified IPA download
on:
  push:
    branches: ['codex/pokopia-scenery']
    paths: ['.github/workflows/deliver-verified-ipa.yml']
permissions:
  contents: write
  actions: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download verified package and previews
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download 39620257152 --name LittleHaven-iPhone-IPA --dir package
          gh run download 39620257152 --name Gameplay-previews --dir previews
          cd package
          echo '2062d809627bc6e14eae672bae8a8bd80c55d8a404f51cefc4faa0c46d62abb4  LittleHaven-unsigned.ipa' | sha256sum --check
      - name: Provide direct IPA download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create test-20-neighborhood package/LittleHaven-unsigned.ipa package/LittleHaven-unsigned.ipa.sha256 previews/LittleHaven-neighbors.png previews/LittleHaven-chair.png previews/LittleHaven-facilities.png previews/LittleHaven-bar-exterior.png previews/LittleHaven-pool-pump.mp4 --target 61300a8241aeed495ece4f567720f2e9b7e1507e --title 'Little Haven 20 - Neighbors, beach loungers and hotel facilities' --prerelease --notes 'Version 20.0 (24): remove overhead character names; relocate the bar into the retail district while preserving the beach; add three neighbor homes and walking residents; usable beach loungers with sit, stand and saved relaxation; physical pool pump with fault sparks that stop after repair, laundry machine, separate breakfast terrace and guest supply pavilion. Existing saved visitors are relocated safely out of new building footprints. Native rules and all 29 simulator tests passed. SideStore feed unchanged.'
