name: Deliver verified IPA download
on:
  push:
    branches: ['codex/pokopia-scenery']
    paths: ['.github/workflows/deliver-verified-ipa.yml']
permissions:
  contents: write
  actions: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download 39594409124 --name LittleHaven-iPhone-IPA --dir package
          gh run download 39594409124 --name Gameplay-previews --dir previews
          cd package
          echo 'f12ef2abd9c343cd47193b594c60bf1e4eee2cf6879db39d79567034001c5fde  LittleHaven-unsigned.ipa' | sha256sum --check
      - name: Save tested character app icon into source
        run: |
          set -euo pipefail
          cp previews/LittleHaven-app-icon.png LittleHaven/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          git config user.name 'Codex'
          git config user.email 'codex@openai.com'
          git add LittleHaven/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          if ! git diff --cached --quiet; then
            git commit -m 'Save tested character app icon [skip ci]'
            git push origin HEAD:codex/pokopia-scenery
          fi
      - name: Provide direct IPA asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create test-19-lantern-bar package/LittleHaven-unsigned.ipa package/LittleHaven-unsigned.ipa.sha256 previews/LittleHaven-bar.png previews/LittleHaven-bar-exterior.png previews/LittleHaven-home-store.png previews/LittleHaven-character-turns.png previews/LittleHaven-staff-posts.png --target "$(git rev-parse HEAD)" --title 'Little Haven 19 - Lantern Bar and storefronts' --prerelease --notes 'Version 19.0 (23): removed the freestanding build sign; commercial storefronts with display windows and awnings; the walk-in Lantern Bar with Jules, drinks, warm decor and six animated, talkative patrons at three tables; directional torso and clothing fixes for the player, family, NPCs and shop uniforms. Native rules and all 28 simulator tests passed. This test download does not change the SideStore feed.'
