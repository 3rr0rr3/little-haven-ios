name: Verify restaurant sizes and build IPA
on:
  push:
    branches: ['fix/restaurant-size']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate Swift and game rules
        run: |
          set -euo pipefail
          swiftc -frontend -parse LittleHaven/*.swift LittleHavenUITests/*.swift
          swiftc LittleHaven/NPCDesign.swift LittleHaven/Management.swift LittleHaven/Office.swift LittleHaven/RPGMap.swift LittleHaven/Game.swift LittleHaven/Motel.swift LittleHaven/MotelWorld.swift Tests/main.swift -o /tmp/little-haven-tests
          /tmp/little-haven-tests
          python3 scripts/validate_painted_art.py
      - name: Build iPhone app
        run: xcodebuild -project LittleHaven.xcodeproj -scheme LittleHaven -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath device-build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verify restaurant interactions
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if "iPhone" in v["name"]))')
          echo "SIM_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project LittleHaven.xcodeproj -scheme LittleHaven -configuration Debug -destination "id=$DEVICE" -derivedDataPath sim-build -parallel-testing-enabled NO -only-testing:LittleHavenUITests/LittleHavenUITests/testFishRestaurantServesMeal -only-testing:LittleHavenUITests/LittleHavenUITests/testBarBartenderServesDrinks -only-testing:LittleHavenUITests/LittleHavenUITests/testShopInteriorExitReturnsToItsOwnDoor -resultBundlePath RestaurantResults.xcresult CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES test
      - name: Capture full height restaurant exteriors
        run: |
          set -euo pipefail
          xcrun simctl terminate "$SIM_DEVICE" com.littlehaven.town || true
          xcrun simctl install "$SIM_DEVICE" sim-build/Build/Products/Debug-iphonesimulator/LittleHaven.app
          for MODE in fish-exterior bar-exterior; do
            xcrun simctl launch "$SIM_DEVICE" com.littlehaven.town "--ui-$MODE" --ui-testing --ui-touch
            sleep 5
            xcrun simctl io "$SIM_DEVICE" screenshot "$MODE.png"
            xcrun simctl terminate "$SIM_DEVICE" com.littlehaven.town
          done
      - name: Verify and package device IPA
        run: |
          set -euo pipefail
          APP=device-build/Build/Products/Release-iphoneos/LittleHaven.app
          test -x "$APP/LittleHaven"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$APP/Info.plist")" = iPhoneOS
          xcrun lipo "$APP/LittleHaven" -verify_arch arm64
          mkdir -p package/Payload
          ditto "$APP" package/Payload/LittleHaven.app
          cd package
          zip -qry ../BrainstormHaven-64.ipa Payload
          cd ..
          unzip -t BrainstormHaven-64.ipa
          shasum -a 256 BrainstormHaven-64.ipa > BrainstormHaven-64.ipa.sha256
      - name: Publish updated installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create restaurant-size-v64 BrainstormHaven-64.ipa BrainstormHaven-64.ipa.sha256 fish-exterior.png bar-exterior.png --target "$GITHUB_SHA" --title 'Brainstorm Haven 64 - Full height restaurants' --prerelease --notes 'Restores Coral Catch and The Lantern Bar to full storefront height, preserving saved entrances and walking routes. Built for arm64 iPhoneOS; game rules and restaurant interaction tests passed. Unsigned IPA for signing with SideStore or your sideloading tool.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Restaurant-size-build
          path: |
            RestaurantResults.xcresult
            *-exterior.png
            BrainstormHaven-64.ipa*
