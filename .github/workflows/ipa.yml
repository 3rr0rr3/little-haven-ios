name: Test and build iPhone IPA
on:
  push:
    branches: [main]
    paths:
      - 'LittleHaven/**'
      - 'LittleHaven.xcodeproj/**'
      - 'LittleHavenUITests/**'
      - 'Tests/**'
      - 'scripts/**'
      - '.github/workflows/ipa.yml'
  workflow_dispatch:
concurrency:
  group: iphone-ipa
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test prologue, motel economy, stealth and checkpoint rules
        run: |
          set -euo pipefail
          swiftc LittleHaven/Management.swift LittleHaven/Office.swift LittleHaven/RPGMap.swift LittleHaven/Game.swift LittleHaven/Motel.swift LittleHaven/MotelWorld.swift Tests/main.swift -o /tmp/little-haven-tests
          /tmp/little-haven-tests
      - name: Build iPhone app
        run: |
          set -euo pipefail
          xcodebuild -project LittleHaven.xcodeproj -scheme LittleHaven -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath device-build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Test controls, motel management and game-over recovery
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if "iPhone" in v["name"]))')
          echo "SIM_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project LittleHaven.xcodeproj -scheme LittleHaven -configuration Debug -destination "id=$DEVICE" -derivedDataPath sim-build -parallel-testing-enabled NO -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Capture chapter previews
        if: ${{ success() && env.SIM_DEVICE != '' }}
        run: |
          set -euo pipefail
          DEVICE="$SIM_DEVICE"
          xcrun simctl uninstall "$DEVICE" com.littlehaven.town
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" sim-build/Build/Products/Debug-iphonesimulator/LittleHaven.app
          xcrun simctl launch "$DEVICE" com.littlehaven.town
          sleep 3
          xcrun simctl io "$DEVICE" screenshot LittleHaven-preview.png
          xcrun simctl terminate "$DEVICE" com.littlehaven.town
          xcrun simctl launch "$DEVICE" com.littlehaven.town --ui-wake
          sleep 3
          xcrun simctl io "$DEVICE" screenshot LittleHaven-wake.png
          xcrun simctl terminate "$DEVICE" com.littlehaven.town
          xcrun simctl launch "$DEVICE" com.littlehaven.town --ui-motel
          sleep 3
          xcrun simctl io "$DEVICE" screenshot LittleHaven-motel.png
          xcrun simctl terminate "$DEVICE" com.littlehaven.town
          xcrun simctl launch "$DEVICE" com.littlehaven.town --ui-motel-preview
          sleep 3
          xcrun simctl io "$DEVICE" screenshot LittleHaven-stealth.png
          xcrun simctl terminate "$DEVICE" com.littlehaven.town
          xcrun simctl launch "$DEVICE" com.littlehaven.town --ui-world-clean
          sleep 3
          xcrun simctl io "$DEVICE" screenshot LittleHaven-cleaning.png
          xcrun simctl terminate "$DEVICE" com.littlehaven.town
          xcrun simctl launch "$DEVICE" com.littlehaven.town --ui-office-preview
          sleep 3
          xcrun simctl io "$DEVICE" screenshot LittleHaven-office.png
          xcrun simctl terminate "$DEVICE" com.littlehaven.town
          xcrun simctl launch "$DEVICE" com.littlehaven.town --ui-dialogue
          sleep 2
          xcrun simctl io "$DEVICE" screenshot LittleHaven-dialogue.png
          xcrun simctl terminate "$DEVICE" com.littlehaven.town
          xcrun simctl launch "$DEVICE" com.littlehaven.town --ui-chaos-fire
          sleep 2
          xcrun simctl io "$DEVICE" screenshot LittleHaven-chaos.png
          xcrun simctl terminate "$DEVICE" com.littlehaven.town
          xcrun simctl launch "$DEVICE" com.littlehaven.town --ui-police
          sleep 2
          xcrun simctl io "$DEVICE" screenshot LittleHaven-police.png
          xcrun simctl terminate "$DEVICE" com.littlehaven.town
          xcrun simctl launch "$DEVICE" com.littlehaven.town --ui-hiring
          sleep 2
          xcrun simctl io "$DEVICE" screenshot LittleHaven-hiring.png
      - name: Capture animated gameplay
        if: ${{ success() && env.SIM_DEVICE != '' }}
        run: |
          set -euo pipefail
          DEVICE="$SIM_DEVICE"
          for MODE in pool fight fire; do
            xcrun simctl terminate "$DEVICE" com.littlehaven.town || true
            xcrun simctl launch "$DEVICE" com.littlehaven.town "--ui-chaos-$MODE"
            sleep 2
            xcrun simctl io "$DEVICE" recordVideo --codec=h264 --force "LittleHaven-$MODE.mp4" &
            RECORD_PID=$!
            sleep 5
            kill -INT "$RECORD_PID"
            wait "$RECORD_PID" || true
            xcrun simctl io "$DEVICE" screenshot "LittleHaven-$MODE.png"
          done
          for MODE in parking-staff weather-storm weather-snow weather-wind; do
            xcrun simctl terminate "$DEVICE" com.littlehaven.town || true
            xcrun simctl launch "$DEVICE" com.littlehaven.town "--ui-$MODE"
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "LittleHaven-$MODE.png"
          done
      - name: Capture management simulation
        if: ${{ success() && env.SIM_DEVICE != '' }}
        run: |
          set -euo pipefail
          DEVICE="$SIM_DEVICE"
          xcrun simctl terminate "$DEVICE" com.littlehaven.town || true
          xcrun simctl launch "$DEVICE" com.littlehaven.town --ui-title
          sleep 3
          xcrun simctl io "$DEVICE" screenshot LittleHaven-title.png
          for MODE in board events cameras night; do
            xcrun simctl terminate "$DEVICE" com.littlehaven.town || true
            xcrun simctl launch "$DEVICE" com.littlehaven.town "--ui-management-$MODE"
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "LittleHaven-management-$MODE.png"
          done
      - name: Verify and package IPA
        run: |
          set -euo pipefail
          APP=device-build/Build/Products/Release-iphoneos/LittleHaven.app
          test -x "$APP/LittleHaven"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$APP/Info.plist")" = "iPhoneOS"
          xcrun lipo "$APP/LittleHaven" -verify_arch arm64
          xcrun vtool -show-build "$APP/LittleHaven" | tee platform.txt
          grep -Eq 'platform[[:space:]]+IOS$' platform.txt
          mkdir -p package/Payload
          ditto "$APP" package/Payload/LittleHaven.app
          cd package
          zip -qry ../LittleHaven-unsigned.ipa Payload
          cd ..
          unzip -t LittleHaven-unsigned.ipa
          shasum -a 256 LittleHaven-unsigned.ipa > LittleHaven-unsigned.ipa.sha256
      - name: Publish IPA, previews and SideStore update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="sideload-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' 'Little Haven 11.0: Immediate D-pad touch response, your character on the title screen, employee break lounge, original guest designs during pool emergencies, expressive faces, emergency evacuation, sedan/SUV/pickup designs and matching options/quit menus. iOS 17+.' 'Wake up and walk around your motel grounds, office and rooms. Meet guests, collect payment, carry cleaning tools, make beds, collect trash, mop spills and expand your motel.' 'Explore occupied rooms, steal belongings and escape before suspicion reaches 100%. Getting caught returns you to your last saved checkpoint.' 'Save at the desk or end the day. Existing cottage saves migrate to the wake-up scene.' 'Unsigned arm64 iPhoneOS build. Sign through your sideloading tool before installing. Physical-device installation has not been verified.' > release-notes.txt
          gh release create "$TAG" LittleHaven-title.png LittleHaven-management-board.png LittleHaven-management-events.png LittleHaven-management-cameras.png LittleHaven-management-night.png LittleHaven-pool.mp4 LittleHaven-fight.mp4 LittleHaven-fire.mp4 LittleHaven-pool.png LittleHaven-fight.png LittleHaven-parking-staff.png LittleHaven-weather-storm.png LittleHaven-weather-snow.png LittleHaven-weather-wind.png LittleHaven-unsigned.ipa LittleHaven-unsigned.ipa.sha256 LittleHaven-preview.png LittleHaven-wake.png LittleHaven-motel.png LittleHaven-stealth.png LittleHaven-cleaning.png LittleHaven-office.png LittleHaven-dialogue.png LittleHaven-chaos.png LittleHaven-police.png LittleHaven-hiring.png --target "$GITHUB_SHA" --title "Little Haven 11.0 - Expressive guests and responsive controls" --prerelease --notes-file release-notes.txt
          gh api "repos/$GH_REPO/contents/sideStore.json" > live-source-response.json
          python3 scripts/update_source.py "$TAG"
          gh api --method PUT "repos/$GH_REPO/contents/sideStore.json" --input source-update.json
      - name: Preserve gameplay previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gameplay-previews
          path: |
            LittleHaven-*.png
            LittleHaven-*.mp4
          if-no-files-found: ignore
      - name: Preserve simulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Simulator-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
