name: Sanctuary proportions IPA
on:
  push:
    branches: ['codex/sanctuary-proportions']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate Swift, saves and game rules
        run: |
          set -euo pipefail
          swiftc -frontend -parse LittleHaven/*.swift LittleHavenUITests/*.swift
          swiftc LittleHaven/NPCDesign.swift LittleHaven/Management.swift LittleHaven/Office.swift LittleHaven/RPGMap.swift LittleHaven/Game.swift LittleHaven/Motel.swift LittleHaven/MotelWorld.swift Tests/main.swift -o /tmp/little-haven-tests
          /tmp/little-haven-tests
          python3 scripts/validate_painted_art.py
      - name: Build iPhone app
        run: xcodebuild -project LittleHaven.xcodeproj -scheme LittleHaven -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath device-build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verify sanctuary care and return upstairs
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if "iPhone" in v["name"]))')
          echo "SIM_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project LittleHaven.xcodeproj -scheme LittleHaven -configuration Debug -destination "id=$DEVICE" -derivedDataPath sim-build -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 -only-testing:LittleHavenUITests/LittleHavenUITests/testHomeBasementStairsReturnHome -only-testing:LittleHavenUITests/LittleHavenUITests/testBasementCreatureFeedingAndPetting -only-testing:LittleHavenUITests/LittleHavenUITests/testHackerChichuCareAndQuest -resultBundlePath SanctuaryScaleResults.xcresult CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES test
      - name: Capture creatures beside the adult player
        run: |
          set -euo pipefail
          xcrun simctl terminate "$SIM_DEVICE" com.littlehaven.town || true
          xcrun simctl install "$SIM_DEVICE" sim-build/Build/Products/Debug-iphonesimulator/LittleHaven.app
          for MODE in sanctuary-scale-0 sanctuary-scale-1 sanctuary-scale-8 sanctuary-scale-11 sanctuary-scale-13 basement; do
            xcrun simctl launch "$SIM_DEVICE" com.littlehaven.town "--ui-$MODE" --ui-testing --ui-touch
            sleep 5
            xcrun simctl io "$SIM_DEVICE" screenshot "$MODE.png"
            xcrun simctl terminate "$SIM_DEVICE" com.littlehaven.town
          done
      - name: Verify and package device IPA
        run: |
          set -euo pipefail
          APP=device-build/Build/Products/Release-iphoneos/LittleHaven.app
          test -x "$APP/LittleHaven"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$APP/Info.plist")" = iPhoneOS
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = 68.0
          xcrun lipo "$APP/LittleHaven" -verify_arch arm64
          mkdir -p package/Payload
          ditto "$APP" package/Payload/LittleHaven.app
          cd package
          zip -qry ../BrainstormHaven-68.ipa Payload
          cd ..
          unzip -t BrainstormHaven-68.ipa
          shasum -a 256 BrainstormHaven-68.ipa > BrainstormHaven-68.ipa.sha256
      - name: Publish updated installer and previews
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create sanctuary-proportions-v68 BrainstormHaven-68.ipa BrainstormHaven-68.ipa.sha256 sanctuary-scale-*.png basement.png --target "$GITHUB_SHA" --title 'Brainstorm Haven 68 - Proportional sanctuary' --prerelease --notes 'Creature sanctuary proportions adjusted to adult character height: small companion cats, a medium fox, human-sized Kawai Tom and a larger Juan. Grounded walking animations, smaller beds and bowls, waist-height fences, compact lamps and signs, and finer floor tiles. Feeding, petting, quests, saved care and sanctuary movement verified. Includes unique houses, Thanksgiving decorations and Hacker Chichu. Unsigned arm64 iPhoneOS IPA for SideStore or your sideloading tool.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sanctuary-Proportions
          path: |
            SanctuaryScaleResults.xcresult
            sanctuary-scale-*.png
            basement.png
            BrainstormHaven-68.ipa*
