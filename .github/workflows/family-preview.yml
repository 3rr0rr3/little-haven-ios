name: Export family office preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/family-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  export:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Simulator-test-results
          run-id: 38934071098
          github-token: ${{ github.token }}
          path: TestResults.xcresult
      - name: Export original simulator screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path exported
          python3 - <<'PY'
          import json, pathlib, shutil
          root = pathlib.Path("exported")
          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values(): yield from walk(child)
              elif isinstance(value, list):
                  for child in value: yield from walk(child)
          for manifest in root.rglob("*.json"):
              data = json.loads(manifest.read_text())
              for item in walk(data):
                  if any(isinstance(v,str) and "Expanded office with family" in v for v in item.values()):
                      for value in item.values():
                          if isinstance(value,str) and value.endswith(".png"):
                              candidates = list(root.rglob(pathlib.Path(value).name))
                              if candidates:
                                  shutil.copyfile(candidates[0], "LittleHaven-family.png")
          if not pathlib.Path("LittleHaven-family.png").exists():
              for p in root.rglob("*.json"): print(p.read_text()[:12000])
              raise SystemExit("Family screenshot not found in export manifest")
          PY
          gh release upload sideload-15-1 LittleHaven-family.png --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Exported-office-screenshots
          path: exported
