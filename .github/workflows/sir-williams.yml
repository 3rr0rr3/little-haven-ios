name: Sir Williams sanctuary IPA
on:
  push:
    branches: ['codex/sir-williams']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate Swift, saves and game rules
        run: |
          set -euo pipefail
          swiftc -frontend -parse LittleHaven/*.swift LittleHavenUITests/*.swift
          swiftc LittleHaven/NPCDesign.swift LittleHaven/Management.swift LittleHaven/Office.swift LittleHaven/RPGMap.swift LittleHaven/Game.swift LittleHaven/Motel.swift LittleHaven/MotelWorld.swift Tests/main.swift -o /tmp/little-haven-tests
          /tmp/little-haven-tests
          python3 scripts/validate_painted_art.py
      - name: Build iPhone app
        run: xcodebuild -project LittleHaven.xcodeproj -scheme LittleHaven -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath device-build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verify Sir Williams, Hacker Chichu and home stairs
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if "iPhone" in v["name"]))')
          echo "SIM_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project LittleHaven.xcodeproj -scheme LittleHaven -configuration Debug -destination "id=$DEVICE" -derivedDataPath sim-build -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 -only-testing:LittleHavenUITests/LittleHavenUITests/testHomeBasementStairsReturnHome -only-testing:LittleHavenUITests/LittleHavenUITests/testSirWilliamsCareAndQuest -only-testing:LittleHavenUITests/LittleHavenUITests/testHackerChichuCareAndQuest -resultBundlePath SirWilliamsResults.xcresult CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES test
      - name: Capture Sir Williams and sanctuary
        run: |
          set -euo pipefail
          xcrun simctl terminate "$SIM_DEVICE" com.littlehaven.town || true
          xcrun simctl install "$SIM_DEVICE" sim-build/Build/Products/Debug-iphonesimulator/LittleHaven.app
          for MODE in sanctuary-williams sanctuary-scale-13 basement; do
            xcrun simctl launch "$SIM_DEVICE" com.littlehaven.town "--ui-$MODE" --ui-testing --ui-touch
            sleep 5
            xcrun simctl io "$SIM_DEVICE" screenshot "$MODE.png"
            xcrun simctl terminate "$SIM_DEVICE" com.littlehaven.town
          done
          xcrun simctl launch "$SIM_DEVICE" com.littlehaven.town --ui-sanctuary-williams --ui-corral-14 --ui-testing --ui-touch
          sleep 5
          xcrun simctl io "$SIM_DEVICE" screenshot sir-williams-portrait.png
          xcrun simctl terminate "$SIM_DEVICE" com.littlehaven.town
      - name: Verify and package device IPA
        run: |
          set -euo pipefail
          APP=device-build/Build/Products/Release-iphoneos/LittleHaven.app
          test -x "$APP/LittleHaven"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$APP/Info.plist")" = iPhoneOS
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = 69.0
          xcrun lipo "$APP/LittleHaven" -verify_arch arm64
          mkdir -p package/Payload
          ditto "$APP" package/Payload/LittleHaven.app
          cd package
          zip -qry ../BrainstormHaven-69.ipa Payload
          cd ..
          unzip -t BrainstormHaven-69.ipa
          shasum -a 256 BrainstormHaven-69.ipa > BrainstormHaven-69.ipa.sha256
      - name: Publish updated installer and previews
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create sir-williams-v69 BrainstormHaven-69.ipa BrainstormHaven-69.ipa.sha256 sanctuary-williams.png sir-williams-portrait.png sanctuary-scale-13.png basement.png --target "$GITHUB_SHA" --title 'Brainstorm Haven 69 - Sir. Williams' --prerelease --notes 'Sir. Williams joins the creature sanctuary: a white plush stag with ivory antlers, black eyes, a red velvet bow and pine sprigs, based on the supplied reference. His own southern corral includes feeding, petting, training and a scarlet-ribbon keepsake quest. Existing residents keep their positions and saved care; stairs move to the expanded south end. Proportional creature sizes, unique houses, Thanksgiving decorations and Hacker Chichu remain included. Game-rule and simulator tests passed. Unsigned arm64 iPhoneOS IPA for SideStore or your sideloading tool.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sir-Williams-Sanctuary
          path: |
            SirWilliamsResults.xcresult
            sanctuary-williams.png
            sir-williams-portrait.png
            sanctuary-scale-13.png
            basement.png
            BrainstormHaven-69.ipa*
